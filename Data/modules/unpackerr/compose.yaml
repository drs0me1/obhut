# Modül: Arşiv açıcı (unpackerr) — DD-148. Konsol'dan kurulur; kurulum yalnız bu dosyayı
# yer tutucuları doldurarak MODULES_DIR/unpackerr/compose.yaml olarak bırakır, hiçbir şeyi
# başlatmaz. Proje adı "unpackerr"; temel Compose projesinden ayrıdır.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "__DOCKER_LOG_MAX_SIZE__"
    max-file: "__DOCKER_LOG_MAX_FILE__"

services:
  unpackerr:
    image: __UNPACKERR_IMAGE__
    container_name: unpackerr
    user: "__DOWNLOADS_UID__:__DOWNLOADS_GID__"
    restart: unless-stopped
    logging: *default-logging
    # Torrent istemcisinin API'si kullanılmaz: parola/port gerekmez. Yalnız indirme ağacını
    # periyodik tarar; arşivleri bulunduğu yere çıkarır (MOVE_BACK).
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    network_mode: none
    environment:
      TZ: __TIMEZONE__
      UN_LOG_FILE: "/downloads/.unpackerr/unpackerr.log"
      UN_LOG_FILE_MB: "10"
      UN_LOG_FILES: "3"
      UN_LOG_QUEUES: "30m"
      UN_FOLDERS_INTERVAL: "10s"
      UN_FOLDER_0_PATH: "/downloads"
      UN_FOLDER_0_EXTRACT_PATH: ""
      UN_FOLDER_0_DELETE_AFTER: "0"
      UN_FOLDER_0_DISABLE_RECURSION: "false"
      UN_FOLDER_0_DELETE_FILES: "false"
      UN_FOLDER_0_DELETE_ORIGINAL: "false"
      UN_FOLDER_0_MOVE_BACK: "true"
      UN_FOLDER_0_EXTRACT_ISOS: "false"
    volumes:
      # DD-144: çöp ve paylaşım kökü indirme klasörünün dışında; bu bağlamaya hiç girmez.
      - __DOWNLOADS_PATH__:/downloads
    tmpfs:
      - /tmp
    stop_grace_period: 30s
