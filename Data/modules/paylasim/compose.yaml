# Modül: Paylaşım (rclone WebDAV) — DD-148, DD-149. Konsol'dan kurulur; kurulum yalnız bu
# dosyayı yer tutucuları doldurarak MODULES_DIR/paylasim/compose.yaml olarak bırakır, hiçbir
# şeyi başlatmaz. Proje adı "paylasim"; temel Compose projesinden ayrıdır. Ağ projenin kendi
# varsayılan ağıdır (paylasim_default): eski temel projenin "paylasim" ağıyla çakışmaz.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "__DOCKER_LOG_MAX_SIZE__"
    max-file: "__DOCKER_LOG_MAX_FILE__"

services:
  # DD-141/DD-142: tek WebDAV. Kökü yalnız .pay/w: dışarıya yalnız Konsol'dan
  # paylaşılanlar açılır, kullanıcı alanının tamamı hiç yayımlanmaz. Bağlantılar
  # izlenir (--copy-links) — bu yüzden alan aynı yolla salt okunur bağlıdır, yoksa
  # göreli bağlantılar kökün dışına düşerdi. Hesabı master-modul üretir (DD-149).
  paylasim:
    image: __RCLONE_IMAGE__
    container_name: paylasim
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    command:
      - serve
      - webdav
      - __SERVER_ROOT__/__SHARE_DIR__/w
      - --config=/dev/null
      - --addr=:8080
      - --htpasswd=/run/secrets/paylasim_htpasswd
      - --dir-cache-time=10s
      - --copy-links
      - --read-only
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q '401'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 5s
    ports:
      - "127.0.0.1:__SHARE_PORT__:8080"
    volumes:
      - __SERVER_ROOT__:__SERVER_ROOT__:ro
      # Hesap dosyası yoksa Docker yerine dizin açmasın: kurulum hata versin.
      - type: bind
        source: __SHARE_HTPASSWD_FILE__
        target: /run/secrets/paylasim_htpasswd
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
