# Modül: qBittorrent (DD-151). Debian paketinin qbittorrent-nox@.service şablonuna eklenir;
# örnek adı indirme klasörünün sahibidir (uid 1000), dosyalar Konsol ve Paylaşım'la aynı
# sahipte kalır. Profil (ayarlar, torrent listesi) __TORRENT_PROFILE_DIR__'de. Kullanıcı alanında
# yazabildiği tek yer indirme klasörü; çöp ve paylaşım kökü ona hiç görünmez (DD-144).
[Service]
Environment=HOME=__TORRENT_PROFILE_DIR__ XDG_CONFIG_HOME=__TORRENT_PROFILE_DIR__ XDG_DATA_HOME=__TORRENT_PROFILE_DIR__ XDG_CACHE_HOME=__TORRENT_PROFILE_DIR__/cache
UMask=0002
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=__TORRENT_PROFILE_DIR__ __DOWNLOADS_PATH__
InaccessiblePaths=-__SERVER_ROOT__/__FILES_PANEL_TRASH__ -__SERVER_ROOT__/__SHARE_DIR__
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
