<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Konsol</title>
<link rel="stylesheet" href="/konsol.css">
<link rel="stylesheet" href="/ayarlar.css">
<link rel="stylesheet" href="/dosyalar.css">
<link rel="stylesheet" href="/panel.css">
<script src="/arsiv.js" defer></script>
<script src="/dosyalar.js" defer></script>
<script src="/ayarlar.js" defer></script>
<script src="/konsol.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">İçeriğe geç</a>
<header class="mobile-brand">
  <span class="wordmark"><span id="brand-host-m">sunucu</span><span class="dot">.</span></span>
  <button type="button" class="btn btn-quiet" id="menu-toggle" aria-controls="panel-sidebar" aria-expanded="false">Menü</button>
</header>
<div class="shell">
  <aside class="side" id="panel-sidebar" aria-label="Sunucu konsolu">
    <div class="brand"><span class="wordmark"><span id="brand-host">sunucu</span><span class="dot">.</span></span><small id="brand-sub">Konsol</small></div>
    <nav class="nav" aria-label="Bölümler">
      <a href="#/dosyalar" data-route="dosyalar" data-icon="folder">Dosyalar</a>
      <a href="#/moduller" data-route="moduller" data-icon="stack">App Store</a>
      <!-- DD-200: installed application links follow this label; konsol.js builds them from each package's declaration. -->
      <span class="side-label" id="installed-label" hidden>Kurulu uygulamalar</span>
      <a href="#/ayarlar" data-route="ayarlar" data-icon="sliders" class="settings-link">Ayarlar</a>
    </nav>
    <section class="resources" aria-label="Sunucu kaynakları">
      <p class="resource-status" id="resource-status" role="status">Kaynaklar okunuyor…</p>
      <div class="resource"><div><span>İşlemci</span><strong id="resource-cpu">—</strong></div><progress id="bar-cpu" max="100" value="0" aria-label="İşlemci kullanımı" hidden></progress><small id="detail-cpu">Örnek bekleniyor</small></div>
      <div class="resource"><div><span>RAM</span><strong id="resource-mem">—</strong></div><progress id="bar-mem" max="100" value="0" aria-label="Bellek kullanımı" hidden></progress><small id="detail-mem">—</small></div>
      <div class="resource"><div><span>Disk</span><strong id="resource-disk">—</strong></div><progress id="bar-disk" max="100" value="0" aria-label="Disk kullanımı" hidden></progress><small id="detail-disk">—</small></div>
    </section>
    <div class="side-foot"><span id="foot-access">Tailscale</span><span class="mono" id="foot-ts">—</span><span class="mono" id="foot-version">—</span><button type="button" class="linkbtn" id="logout">Çıkış yap</button></div>
  </aside>
  <main class="main" id="main-content" tabindex="-1">
    <div class="content">
      <header class="topbar">
        <div><p class="eyebrow" id="eyebrow">Sunucu yönetimi</p><h1 id="title">Dosyalar</h1></div>
        <div class="top-actions" id="top-actions"></div>
      </header>

      <!-- Application pages (DD-200): sections are created by konsol.js for installed packages. -->

      <!-- DOSYALAR -->
      <section data-view="dosyalar" hidden>
        <nav id="fs-tabs" class="fs09-tabs" aria-label="Dosya bölümleri"></nav>
        <!-- Folder shortcuts, selection actions and uploads share one workspace. -->
        <div class="fswrap">
          <nav class="fsrail" id="fs-rail" aria-label="Klasörler"></nav>
          <div class="fspanel" id="fs-panel"><div id="fs-body" class="fs-body"></div></div>
        </div>
      </section>

      <!-- Optional applications; built-in services live in Settings. -->
      <section data-view="moduller" hidden>
        <div class="store-list" id="mod-grid" aria-label="Uygulamalar"></div>
        <section class="store-detail" id="mod-detail" aria-labelledby="mod-detail-title" hidden></section>
      </section>

      <section data-view="torrent" hidden>
        <div id="torrent-status" class="app-toolbar"></div>
        <details class="card app-account"><summary>İlk giriş bilgileri</summary><div id="torrent-account"></div></details>
        <div id="torrent-settings"></div>
      </section>

      <section data-view="ayarlar" hidden>
        <div id="settings-page" aria-label="Sunucu ayarları"></div>
      </section>
    </div>
  </main>
</div>

<!-- genel amaçlı pencere: uygulama sayfalarının formları, paylaşım, arşiv, dosya görüntüleyici -->
<dialog id="sh" aria-labelledby="sh-title"><div class="dlg" id="sh-body"></div></dialog>

<dialog id="cf" aria-labelledby="cf-title">
  <form class="dlg" id="cf-form" novalidate>
    <div class="dlg-head">
      <div><h3 id="cf-title">Onay</h3><p id="cf-sub"></p></div>
      <button class="dlg-x" type="button" id="cf-x" aria-label="Kapat"></button>
    </div>
    <ul class="conseq" id="cf-list"></ul>
    <div id="cf-extra"></div>
    <div class="confirm-row" id="cf-word-row">
      <label for="cf-word">Onay için <strong>onayla</strong> yazın</label>
      <input type="text" id="cf-word" autocomplete="off" spellcheck="false">
    </div>
    <div class="dlg-foot">
      <button class="btn btn-quiet" type="button" id="cf-cancel">Vazgeç</button>
      <button class="btn btn-danger" type="submit" id="cf-go" disabled>Tamam</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
