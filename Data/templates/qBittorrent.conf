# master-stack (DD-129): kurulumun yönettiği qBittorrent ayarları.
# Kaynağı: temiz qBittorrent dosyası + operatörün arayüzde yaptığı değişiklikler
# (2026-09-14, nrm). Kurulum her çalıştırmada yalnız bu anahtarları canlı
# dosyayla karşılaştırır; farklı olanı yazar, qBittorrent'in eklediği diğer
# anahtarlara dokunmaz. Portlar burada yok: imaj --webui-port ve
# --torrenting-port verir. WebUI\Username ve WebUI\Password_PBKDF2 satırları
# kurulum.env'den (TORRENT_USER/TORRENT_PASS) eklenir.
[AutoRun]
enabled=false
program=

[BitTorrent]
Session\DefaultSavePath=/downloads/
Session\MaxActiveDownloads=12
Session\MaxActiveTorrents=12
Session\MaxActiveUploads=12
Session\MaxConnections=800
Session\MaxConnectionsPerTorrent=220
Session\MaxUploads=120
Session\MaxUploadsPerTorrent=64
Session\Preallocation=true
Session\QueueingSystemEnabled=true
Session\RefreshInterval=600
Session\TempPath=/downloads/incomplete/
Session\TempPathEnabled=true

[LegalNotice]
Accepted=true

[Network]
PortForwardingEnabled=false

[Preferences]
Connection\UPnP=false
Downloads\SavePath=/downloads/
Downloads\TempPath=/downloads/incomplete/
General\Locale=en
WebUI\Address=*
WebUI\AuthSubnetWhitelistEnabled=false
WebUI\LocalHostAuth=true
WebUI\ServerDomains=*
