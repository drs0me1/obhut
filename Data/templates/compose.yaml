# Master stack Compose — yer tutucular kurulumda defaults.env / state ile doldurulur.
# Compose .env kullanılmaz; WAN/endpoint ipucu state.env'dedir, burada değil.

# Log rotasyonu servis tanımının parçası (DD-110): daemon.json'daki log-opts
# yalnız konteyner OLUŞTURULURKEN okunur ve mevcut konteynerlere hiç ulaşmaz.
# Burada olunca değişiklik bir compose farkıdır ve konteyner yeniden yaratılır.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "__DOCKER_LOG_MAX_SIZE__"
    max-file: "__DOCKER_LOG_MAX_FILE__"

services:
  dozzle:
    image: __DOZZLE_IMAGE__
    container_name: dozzle
    restart: unless-stopped
    logging: *default-logging
    # DD-116: durum, canlı log, başlat/durdur/sil. docker.sock root'a denk
    # (`:ro` API'yi kısıtlamaz): yalnız loopback + Caddy (tailnet) + users.yml
    # girişi. Shell (exec) kapalı; kullanıcı rolü `actions`.
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_NO_ANALYTICS: "true"
      TZ: __TIMEZONE__
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    ports:
      - "127.0.0.1:__DOZZLE_UI_PORT__:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - __DOZZLE_DATA_DIR__:/data
    tmpfs:
      - /tmp

  qbittorrent:
    image: __QBITTORRENT_IMAGE__
    container_name: qbittorrent
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:__TORRENT_UI_PORT__:__TORRENT_UI_PORT__"
      # Peer: IPv4-only 1:1 (0.0.0.0). [::] publish yok — MASTER-DOCKER6 zaten
      # WAN peer'i DROP ederdi; çift yığın gürültüydü. WAN IP gömülmez.
      - "0.0.0.0:__TORRENT_PUBLIC_PORT__:__TORRENT_PUBLIC_PORT__/tcp"
      - "0.0.0.0:__TORRENT_PUBLIC_PORT__:__TORRENT_PUBLIC_PORT__/udp"
    environment:
      TZ: __TIMEZONE__
      PUID: "__DOWNLOADS_UID__"
      PGID: "__DOWNLOADS_GID__"
      # DD-127: imaj iki portu her açılışta komut satırından verir
      # (--webui-port, --torrenting-port); ayar dosyası bunları değiştiremez.
      WEBUI_PORT: "__TORRENT_UI_PORT__"
      TORRENTING_PORT: "__TORRENT_PUBLIC_PORT__"
    volumes:
      # DD-144: istemci yalnız indirme klasörünü görür; kütüphane, çöp ve paylaşım
      # kökü kullanıcı alanının üst seviyesinde, bu bağlamanın dışında kalır.
      - __QBITTORRENT_DATA_DIR__:/config
      - __DOWNLOADS_PATH__:/downloads
    stop_grace_period: 30s

  # DD-141/DD-142: tek WebDAV. Kökü yalnız .pay/w: dışarıya yalnız Konsol'dan
  # paylaşılanlar açılır, kullanıcı alanının tamamı hiç yayımlanmaz. Bağlantılar
  # izlenir (--copy-links) — bu yüzden alan aynı yolla salt okunur bağlıdır, yoksa
  # göreli bağlantılar kökün dışına düşerdi. Hesap htpasswd'de (DD-144).
  paylasim:
    image: __RCLONE_IMAGE__
    container_name: paylasim
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    command:
      - serve
      - webdav
      - __SERVER_ROOT__/__SHARE_DIR__/w
      - --config=/dev/null
      - --addr=:8080
      - --htpasswd=/run/secrets/paylasim_htpasswd
      - --dir-cache-time=10s
      - --copy-links
      - --read-only
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q '401'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 5s
    ports:
      - "127.0.0.1:__SHARE_PORT__:8080"
    volumes:
      - __SERVER_ROOT__:__SERVER_ROOT__:ro
      - __SHARE_HTPASSWD_FILE__:/run/secrets/paylasim_htpasswd:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    networks:
      - paylasim

networks:
  # Yalnız paylaşım WebDAV'ı; Caddy host loopback publish ile erişir (docker_default yok).
  # internal:true host port publish'i düşürür — kullanılmaz (DD-82).
  paylasim:
    name: paylasim
    driver: bridge
