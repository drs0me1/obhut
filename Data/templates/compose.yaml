# Master stack Compose — yer tutucular kurulumda defaults.env / state ile doldurulur.
# Compose .env kullanılmaz; WAN/endpoint ipucu state.env'dedir, burada değil.

# Log rotasyonu servis tanımının parçası (DD-110): daemon.json'daki log-opts
# yalnız konteyner OLUŞTURULURKEN okunur ve mevcut konteynerlere hiç ulaşmaz.
# Burada olunca değişiklik bir compose farkıdır ve konteyner yeniden yaratılır.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "__DOCKER_LOG_MAX_SIZE__"
    max-file: "__DOCKER_LOG_MAX_FILE__"

services:
  dozzle:
    image: __DOZZLE_IMAGE__
    container_name: dozzle
    restart: unless-stopped
    logging: *default-logging
    # DD-116: durum, canlı log, başlat/durdur/sil. docker.sock root'a denk
    # (`:ro` API'yi kısıtlamaz): yalnız loopback + Caddy (tailnet) + users.yml
    # girişi. Shell (exec) kapalı; kullanıcı rolü `actions`.
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_NO_ANALYTICS: "true"
      TZ: __TIMEZONE__
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    ports:
      - "127.0.0.1:__DOZZLE_UI_PORT__:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - __DOZZLE_DATA_DIR__:/data
    tmpfs:
      - /tmp

  qbittorrent:
    image: __QBITTORRENT_IMAGE__
    container_name: qbittorrent
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:__TORRENT_UI_PORT__:__TORRENT_UI_PORT__"
      # Peer: IPv4-only 1:1 (0.0.0.0). [::] publish yok — MASTER-DOCKER6 zaten
      # WAN peer'i DROP ederdi; çift yığın gürültüydü. WAN IP gömülmez.
      - "0.0.0.0:__TORRENT_PUBLIC_PORT__:__TORRENT_PUBLIC_PORT__/tcp"
      - "0.0.0.0:__TORRENT_PUBLIC_PORT__:__TORRENT_PUBLIC_PORT__/udp"
    environment:
      TZ: __TIMEZONE__
      PUID: "__DOWNLOADS_UID__"
      PGID: "__DOWNLOADS_GID__"
      # DD-127: imaj iki portu her açılışta komut satırından verir
      # (--webui-port, --torrenting-port); ayar dosyası bunları değiştiremez.
      WEBUI_PORT: "__TORRENT_UI_PORT__"
      TORRENTING_PORT: "__TORRENT_PUBLIC_PORT__"
    volumes:
      # DD-144: istemci yalnız indirme klasörünü görür; kütüphane, çöp ve paylaşım
      # kökü kullanıcı alanının üst seviyesinde, bu bağlamanın dışında kalır.
      - __QBITTORRENT_DATA_DIR__:/config
      - __DOWNLOADS_PATH__:/downloads
    stop_grace_period: 30s
