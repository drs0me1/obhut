# Master stack Compose — değerler defaults.env / .env üzerinden gelir.
# Kurulumda bir kez doldurulan yer tutucular: CIFT_ALT_CIZGI + AD + CIFT_ALT_CIZGI
# Runtime: ${AD} Compose .env'den genişler.

services:
  portainer:
    image: __PORTAINER_IMAGE__
    container_name: portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:__PORTAINER_UI_PORT__:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  filebrowser:
    image: __FILEBROWSER_IMAGE__
    container_name: filebrowser
    user: "__DOWNLOADS_UID__:__DOWNLOADS_GID__"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      TZ: __TIMEZONE__
      FILEBROWSER_CONFIG: /config.yaml
      FILEBROWSER_DATABASE: /home/filebrowser/data/database.db
    ports:
      - "127.0.0.1:__FILEBROWSER_UI_PORT__:80"
    volumes:
      # Panel kökü = host /downloads (tümü)
      - __DOWNLOADS_PATH__:/data
      - __QUANTUM_CONFIG_FILE__:/config.yaml:ro
      - filebrowser_data:/home/filebrowser/data
    tmpfs:
      - /tmp
      - /home/filebrowser/tmp

  qbittorrent:
    image: __QBITTORRENT_IMAGE__
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "127.0.0.1:__QBIT_UI_PORT__:__QBIT_UI_PORT__"
      # Peer: IPv4-only 1:1 (0.0.0.0). [::] publish yok — MASTER-DOCKER6 zaten
      # WAN peer'i DROP ederdi; çift yığın gürültüydü. WAN IP gömülmez.
      - "0.0.0.0:__QBIT_PUBLIC_PORT__:__QBIT_PUBLIC_PORT__/tcp"
      - "0.0.0.0:__QBIT_PUBLIC_PORT__:__QBIT_PUBLIC_PORT__/udp"
    environment:
      TZ: __TIMEZONE__
      PUID: "1000"
      PGID: "1000"
      WEBUI_PORT: "__QBIT_UI_PORT__"
      TORRENTING_PORT: "__QBIT_PUBLIC_PORT__"
    volumes:
      - qbit_config:/config
      - __DOWNLOADS_PATH__:/downloads
    stop_grace_period: 10s

  unpackerr:
    image: __UNPACKERR_IMAGE__
    container_name: unpackerr
    user: "1000:1000"
    restart: unless-stopped
    # qBittorrent API yok: parola/port gerekmez. Yalnız /downloads ağacını
    # periyodik tarar; arşivleri bulunduğu yere çıkarır (MOVE_BACK).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      TZ: __TIMEZONE__
      UN_LOG_FILE: "/downloads/.unpackerr/unpackerr.log"
      UN_LOG_FILE_MB: "10"
      UN_LOG_FILES: "3"
      UN_LOG_QUEUES: "30m"
      UN_FOLDERS_INTERVAL: "10s"
      UN_FOLDER_0_PATH: "/downloads"
      UN_FOLDER_0_EXTRACT_PATH: ""
      UN_FOLDER_0_DELETE_AFTER: "0"
      UN_FOLDER_0_DISABLE_RECURSION: "false"
      UN_FOLDER_0_DELETE_FILES: "false"
      UN_FOLDER_0_DELETE_ORIGINAL: "false"
      UN_FOLDER_0_MOVE_BACK: "true"
      UN_FOLDER_0_EXTRACT_ISOS: "false"
    volumes:
      - __DOWNLOADS_PATH__:/downloads
    tmpfs:
      - /tmp
    stop_grace_period: 30s

  wg-easy:
    image: __WG_EASY_IMAGE__
    container_name: wg-easy
    restart: unless-stopped
    # v15: WireGuard dinleme portu env ile set edilmez; ilk web kurulumunda
    # Host=tespit edilen WAN_IPV4, Port=WG_PUBLIC_PORT (aşama 0) seçilir.
    # Docker map 1:1 — iç ve dış UDP aynı; port değişince şablon yeniden yazılır.
    # Healthcheck: H5 — yalnız wg0 ayakta mı; port/UI kurulumu beklenmez.
    # start_interval: imaj varsayılanı (~60s) "starting"i uzatmasın diye legacy ile aynı.
    healthcheck:
      test:
        - CMD-SHELL
        - '/usr/bin/timeout 5s /bin/sh -c "/usr/bin/wg show | /bin/grep -q interface"'
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      TZ: __TIMEZONE__
      INSECURE: "true"
    ports:
      - "127.0.0.1:__WG_UI_PORT__:__WG_UI_PORT__/tcp"
      # WireGuard UDP: IPv4-only 1:1. WAN IP gömülmez; IP değişince remap yok.
      - "0.0.0.0:__WG_PUBLIC_PORT__:__WG_PUBLIC_PORT__/udp"
    volumes:
      - wg_easy_data:/etc/wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    networks:
      wg:
        ipv4_address: __WG_BRIDGE_IPV4__
        ipv6_address: __WG_BRIDGE_IPV6__

networks:
  wg:
    name: wg
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: __WG_BRIDGE_SUBNET__
        - subnet: __WG_BRIDGE_SUBNET6__

volumes:
  portainer_data:
  filebrowser_data:
  qbit_config:
  wg_easy_data:
