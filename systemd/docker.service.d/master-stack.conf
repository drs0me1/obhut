# Docker start after an INPUT-only firewall apply must re-run the oneshot:
# RemainAfterExit leaves master-firewall "active", so WantedBy start is a no-op.
# --no-block: avoid deadlock (docker waits for ExecStartPost; firewall After=docker).
[Service]
ExecStartPost=-/bin/systemctl --no-block restart master-firewall.service
